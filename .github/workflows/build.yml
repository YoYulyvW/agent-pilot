name: Build AgentPilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AgentPilot/**"
      - "project.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===== 1. 版本号 =====
      - name: Compute version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building $VERSION"

      # ===== 2. Xcode =====
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      # ===== 3. xcodegen =====
      - name: Install xcodegen
        run: brew install xcodegen

      # ===== 4. 图标 =====
      - name: Setup App Icon
        run: |
          ICON_DIR="AgentPilot/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          if [ ! -f "icon/icon.png" ]; then
            echo "❌ 未找到 icon/icon.png"
            exit 1
          fi
          sips -s format png --resampleHeightWidth 1024 1024 \
            icon/icon.png --out "$ICON_DIR/icon_1024.png" >/dev/null
          printf '%s' '{"images":[{"filename":"icon_1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ICON_DIR/Contents.json"

      # ===== 5. 生成工程 =====
      - name: Generate Xcode project
        run: xcodegen generate

      # ===== 6. 编译（无签名，供 TrollStore）=====
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project AgentPilot.xcodeproj \
            -scheme AgentPilot \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # ===== 7. 打包 IPA =====
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AgentPilot.app Payload/
          zip -r AgentPilot.ipa Payload
          ls -la AgentPilot.ipa

      # ===== 8. Artifact（备用下载）=====
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentPilot-ipa-${{ steps.version.outputs.version }}
          path: AgentPilot.ipa
          retention-days: 30

      # ===== 9. 发布：IPA 提交回本仓库，生成 raw 直链 =====
      - name: Publish IPA to repo
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

          mkdir -p dist
          cp AgentPilot.ipa dist/AgentPilot.ipa

          IPA_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/dist/AgentPilot.ipa"
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          python3 - <<PYEOF
          import json, os
          data = {
              "version": os.environ["VERSION"],
              "ipa_url": "${IPA_URL}",
              "published_at": "${PUBLISHED_AT}",
              "notes": (os.environ.get("COMMIT_MSG") or "").strip()[:500]
          }
          with open("dist/latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PYEOF

          git add -f dist
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "release: v${VERSION} [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
            echo "✅ 直链: ${IPA_URL}"
          fi
