name: AgentPilot
options:
  bundleIdPrefix: com.yoyulyvw
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  postGenCommand: sed -i.bak -E 's|objectVersion = [0-9]+|objectVersion = 60|' AgentPilot.xcodeproj/project.pbxproj

targets:
  AgentPilot:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: AgentPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yoyulyvw.agentpilot
        PRODUCT_NAME: AgentPilot
        MARKETING_VERSION: "1.0.0"           # 兜底，会被 CI 覆盖
        CURRENT_PROJECT_VERSION: "1"         # 兜底，会被 CI 覆盖
        INFOPLIST_FILE: AgentPilot/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
